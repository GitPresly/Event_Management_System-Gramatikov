{% extends "base.html" %}

{% block title %}Смяна на парола{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-12 col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h4 mb-4">Смяна на парола</h1>
                    <form method="post" novalidate>
                        {% csrf_token %}
                        {% include "partials/form_fields.html" %}
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Смени паролата</button>
                            <a href="{% url 'accounts:profile' %}" class="btn btn-outline-secondary">Отказ</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
