<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="Билет — Система за управление на събития">
    <title>Система за управление на събития</title>

    <!-- Основа в основния цвят на интерфейса (Bootstrap primary). -->
    <rect width="64" height="64" rx="14" fill="#0d6efd"/>

    <!-- Изрезките отстрани се получават чрез маска: белите части остават,
         черните се премахват. Така формата се чете като билет. -->
    <mask id="ticket-notches">
        <rect x="10" y="20" width="44" height="26" rx="5" fill="#ffffff"/>
        <circle cx="10" cy="33" r="5" fill="#000000"/>
        <circle cx="54" cy="33" r="5" fill="#000000"/>
    </mask>

    <rect x="10" y="20" width="44" height="26" rx="5" fill="#ffffff"
          mask="url(#ticket-notches)"/>

    <!-- Перфорацията, по която билетът се къса при вход. -->
    <line x1="32" y1="25" x2="32" y2="41" stroke="#0d6efd"
          stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3.5"/>
</svg>
