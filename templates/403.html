{% extends "base.html" %}

{% block title %}Отказан достъп{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-12 col-md-7 text-center py-5">
            <div style="font-size: 4rem;" aria-hidden="true">🚫</div>
            <h1 class="h3 mt-3">Отказан достъп</h1>
            <p class="text-muted">
                {% if exception %}{{ exception }}{% else %}
                    Нямате необходимите права за достъп до тази страница.
                {% endif %}
            </p>
            <a href="{% url 'events:event_list' %}" class="btn btn-primary mt-2">Към началната страница</a>
        </div>
    </div>
{% endblock %}
